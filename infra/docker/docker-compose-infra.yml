# ╔══════════════════════════════════════════════════════════════╗
# ║  docker-compose-infra.yml                                   ║
# ║  Sobe: Kafka, Redis, CockroachDB, PostgreSQL, LocalStack    ║
# ║                                                             ║
# ║  Subir:  docker compose -f infra/docker/docker-compose-infra.yml up -d
# ║  + UIs:  docker compose -f infra/docker/docker-compose-infra.yml --profile dev up -d
# ║  Parar:  docker compose -f infra/docker/docker-compose-infra.yml down
# ╚══════════════════════════════════════════════════════════════╝
#
# COMO AS VARIÁVEIS FUNCIONAM:
# ${VAR} no yml  → lido do .env na RAIZ do projeto
# env_file:      → injeta variáveis dentro do container

services:

  kafka:
    image: apache/kafka:4.0.0
    container_name: kafka-broker
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9094
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9093,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
    env_file: ../../.env
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1" ]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s
    networks:
      - internal-net
      - kafka-net

  kafka-init:
    image: apache/kafka:4.0.0
    container_name: kafka-init
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      bash -c "
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9093 --create --if-not-exists --topic radar.updated          --partitions 3 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9093 --create --if-not-exists --topic route.calculated       --partitions 3 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9093 --create --if-not-exists --topic route.saved.command    --partitions 3 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9093 --create --if-not-exists --topic route.saved.reply      --partitions 3 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9093 --create --if-not-exists --topic account.delete.command --partitions 3 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9093 --create --if-not-exists --topic account.delete.reply   --partitions 3 --replication-factor 1 &&
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9093 --create --if-not-exists --topic saga.dead-letter       --partitions 3 --replication-factor 1 &&
        echo 'Topicos criados!'
      "
    networks:
      - kafka-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8086:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-kraft
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9093
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - kafka-net
    profiles:
      - dev

  redis-weather:
    image: redis:7-alpine
    ports:
      - "6379:6379"       # ✅ expõe para o host
    container_name: redis-weather
    restart: unless-stopped
    env_file: ../../.env
    command: >
      redis-server
      --requirepass ${REDIS_WEATHER_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-weather-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_WEATHER_PASSWORD ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - weather-net

  redis-alert:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    container_name: redis-alert
    restart: unless-stopped
    env_file: ../../.env
    command: >
      redis-server
      --requirepass ${REDIS_ALERT_PASSWORD}
      --maxmemory 128mb
      --maxmemory-policy volatile-ttl
    volumes:
      - redis-alert-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_ALERT_PASSWORD ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - alert-net

  cockroachdb:
    image: cockroachdb/cockroach:v24.1.0
    container_name: cockroachdb
    restart: unless-stopped
    command: start-single-node --insecure --store=/cockroach/data
    ports:
      - "26257:26257"
      - "8090:8080"
    volumes:
      - cockroach-data:/cockroach/data
    healthcheck:
      test: ["CMD", "cockroach", "node", "status", "--insecure", "--host=cockroachdb:26257"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s
    networks:
      - routing-net

  cockroachdb-init:
    image: cockroachdb/cockroach:v24.1.0
    container_name: cockroachdb-init
    restart: "no"
    command: >
      sql --insecure --host=cockroachdb:26257
      --execute="CREATE DATABASE IF NOT EXISTS routing;"
    depends_on:
      cockroachdb:
        condition: service_healthy
    networks:
      - routing-net

  postgres:
    image: postgres:16-alpine
    container_name: postgres-user
    restart: unless-stopped
    env_file: ../../.env
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../../services/user-service/src/main/resources/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d userdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - user-net

  localstack:
    image: localstack/localstack:3.8
    container_name: localstack
    restart: unless-stopped
    ports:
      - "4566:4566"
    environment:
      - SERVICES=dynamodb,apigateway
      - PERSISTENCE=1
      - DEBUG=0
      - DOCKER_HOST=npipe:////./pipe/docker_engine
      - GATEWAY_LISTEN=0.0.0.0:4566    # ✅ Windows
    volumes:
      - localstack-data:/var/lib/localstack
      - //var/run/docker.sock:/var/run/docker.sock   # ✅ Windows
    healthcheck:
      test: [ "CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health | grep -q 'available'" ]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s
    networks:
      - observability-net

  localstack-init:
    image: amazon/aws-cli:latest
    container_name: localstack-init
    restart: "no"
    depends_on:
      localstack:
        condition: service_healthy
    env_file: ../../.env
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_REGION}
    # ✅ Comando em uma única linha — sem YAML folding
    command: >-
      dynamodb create-table
      --table-name observability-logs
      --attribute-definitions AttributeName=serviceId,AttributeType=S AttributeName=timestamp,AttributeType=S
      --key-schema AttributeName=serviceId,KeyType=HASH AttributeName=timestamp,KeyType=RANGE
      --billing-mode PAY_PER_REQUEST
      --endpoint-url http://localstack:4566
    networks:
      - observability-net

  dynamodb-admin:
    image: aaronshaf/dynamodb-admin
    container_name: dynamodb-admin
    ports:
      - "8001:8001"
    environment:
      - DYNAMO_ENDPOINT=http://localstack:4566
    depends_on:
      localstack:
        condition: service_healthy
    networks:
      - observability-net
    profiles:
      - dev

volumes:
  kafka-data:
  redis-weather-data:
  redis-alert-data:
  cockroach-data:
  postgres-data:
  localstack-data:

networks:
  internal-net:
    driver: bridge
    name: weather_app_internal
  kafka-net:
    driver: bridge
    name: weather_app_kafka
  weather-net:
    driver: bridge
    name: weather_app_weather
  routing-net:
    driver: bridge
    name: weather_app_routing
  user-net:
    driver: bridge
    name: weather_app_user
  alert-net:
    driver: bridge
    name: weather_app_alert
  observability-net:
    driver: bridge
    name: weather_app_observability